<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>简单 Pong 游戏</title>
  <style>
    html,body{height:100%;margin:0;font-family: Arial, Helvetica, sans-serif;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;}
    .container{position:relative;width:820px;}
    canvas{background:#000;display:block;border:3px solid #444;box-shadow:0 0 20px rgba(0,0,0,0.5);}
    .scoreboard{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:28px;letter-spacing:6px;color:#fff;user-select:none;}
    .hint{margin-top:10px;text-align:center;color:#bbb;font-size:13px;}
  </style>
</head>
<body>
  <div class="container">
    <div class="scoreboard"><span id="playerScore">0</span>  :  <span id="cpuScore">0</span></div>
    <canvas id="game" width="800" height="500"></canvas>
    <div class="hint">控制左挡板：鼠标移动 或 键盘 ↑ ↓</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const paddleW = 10, paddleH = 90, paddleMargin = 10;
    const player = { x: paddleMargin, y: (H - paddleH) / 2, w: paddleW, h: paddleH, speed: 6 };
    const cpu = { x: W - paddleW - paddleMargin, y: (H - paddleH) / 2, w: paddleW, h: paddleH, speed: 4 };
    const ballRadius = 8;
    let ball = createBall();
    let playerScore = 0, cpuScore = 0;
    const playerScoreEl = document.getElementById('playerScore');
    const cpuScoreEl = document.getElementById('cpuScore');
    const keys = { up:false, down:false };
    function createBall(direction = (Math.random() > 0.5 ? 1 : -1)) {
      const speed = 4;
      return { x: W/2, y: H/2, r: ballRadius, vx: speed * direction, vy: (Math.random() * 4 - 2) };
    }
    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
    function circleRectCollision(c, r) {
      const nearestX = clamp(c.x, r.x, r.x + r.w);
      const nearestY = clamp(c.y, r.y, r.y + r.h);
      const dx = c.x - nearestX;
      const dy = c.y - nearestY;
      return (dx*dx + dy*dy) <= (c.r * c.r);
    }
    function update() {
      if (keys.up) player.y -= player.speed;
      if (keys.down) player.y += player.speed;
      player.y = clamp(player.y, 0, H - player.h);
      const cpuCenter = cpu.y + cpu.h/2;
      if (ball.y < cpuCenter - 6) cpu.y -= cpu.speed;
      else if (ball.y > cpuCenter + 6) cpu.y += cpu.speed;
      cpu.y = clamp(cpu.y, 0, H - cpu.h);
      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy = -ball.vy; }
      else if (ball.y + ball.r >= H) { ball.y = H - ball.r; ball.vy = -ball.vy; }
      if (circleRectCollision(ball, player) && ball.vx < 0) {
        ball.x = player.x + player.w + ball.r;
        ball.vx = -ball.vx;
        const impact = (ball.y - (player.y + player.h/2));
        ball.vy += impact * 0.04;
        ball.vx *= 1.03;
      }
      if (circleRectCollision(ball, cpu) && ball.vx > 0) {
        ball.x = cpu.x - ball.r;
        ball.vx = -ball.vx;
        const impact = (ball.y - (cpu.y + cpu.h/2));
        ball.vy += impact * 0.04;
        ball.vx *= 1.03;
      }
      if (ball.x + ball.r < 0) {
        cpuScore++; cpuScoreEl.textContent = cpuScore; ball = createBall(1);
      } else if (ball.x - ball.r > W) {
        playerScore++; playerScoreEl.textContent = playerScore; ball = createBall(-1);
      }
    }
    function draw() {
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = '#444'; ctx.lineWidth = 2; ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#fff'; ctx.fillRect(player.x, player.y, player.w, player.h); ctx.fillRect(cpu.x, cpu.y, cpu.w, cpu.h);
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    }
    function loop(){ update(); draw(); requestAnimationFrame(loop); }
    document.addEventListener('keydown', e => { if (e.key === 'ArrowUp') keys.up = true; if (e.key === 'ArrowDown') keys.down = true; });
    document.addEventListener('keyup', e => { if (e.key === 'ArrowUp') keys.up = false; if (e.key === 'ArrowDown') keys.down = false; });
    canvas.addEventListener('mousemove', e => { const rect = canvas.getBoundingClientRect(); const y = e.clientY - rect.top; player.y = clamp(y - player.h/2, 0, H - player.h); });
    canvas.addEventListener('mousedown', e => e.preventDefault());
    loop();
    function resetScores(){ playerScore = 0; cpuScore = 0; playerScoreEl.textContent = playerScore; cpuScoreEl.textContent = cpuScore; ball = createBall(); player.y = (H - player.h) / 2; cpu.y = (H - cpu.h) / 2; }
    window.resetScores = resetScores;
  </script>
</body>
</html>
